# Production Environment Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (Production)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate (Production)
# validate ensures the database schema matches the entity classes, without making changes
spring.jpa.hibernate.ddl-auto=validate
# Disable SQL logging in production to avoid flooding logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging (Production)
logging.level.com.employeehub=INFO
